<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Inspect AI agent runs, trace tool calls and retries, and review evidence-linked heuristic diagnoses of failures."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Agent Incident Investigator</title>
    <script>
      // Apply a saved theme before first paint to avoid a light/dark flash.
      try {
        var theme = localStorage.getItem('aii.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        // Storage can be unavailable (private mode, blocked cookies); fall back to the system theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
